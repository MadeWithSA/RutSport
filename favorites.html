<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Избранное — Rut Sport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Rut <span>Sport</span></a>
      <button class="menu-toggle" id="menuToggle">☰</button>
      <nav class="nav">
        <a href="index.html" data-i18n="home">Главная</a>
        <a href="catalog.html" data-i18n="catalog">Каталог</a>
        <a href="cart.html" data-i18n="cart">Корзина</a>
        <a href="favorites.html" class="active" data-i18n="favorites">Избранное</a>
        <a href="profile.html" data-i18n="profile">Профиль</a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch">
          <button class="lang-btn" data-lang="uz">UZ</button>
          <button class="lang-btn active" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeToggle">🌙</button>
        <a href="favorites.html" class="icon-btn">❤️ <span class="badge fav-badge">0</span></a>
        <a href="cart.html" class="icon-btn">🛒 <span class="badge cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <main class="main">
    <h1 class="section-title" data-i18n="yourFavorites">Избранные товары</h1>
    <div id="favContent"></div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">© 2025 Rut Sport. <span data-i18n="rights">Все права защищены</span></div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderFavorites() {
      const favs = getFavorites();
      const lang = getLang();
      const container = document.getElementById('favContent');

      if (favs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">❤️</div>
            <p data-i18n="emptyFavorites">${t('emptyFavorites')}</p>
            <a href="catalog.html" class="btn btn-primary mt-20" data-i18n="continueShopping">${t('continueShopping')}</a>
          </div>
        `;
        return;
      }

      const list = favs.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
      container.innerHTML = `<div class="products-grid">${list.map(productCardHTML).join('')}</div>`;
    }

    window.onLangChange = renderFavorites;
    document.addEventListener('DOMContentLoaded', renderFavorites);
  </script>
</body>
</html>
