<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — Rut Sport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Rut <span>Sport</span></a>
      <button class="menu-toggle" id="menuToggle">☰</button>
      <nav class="nav">
        <a href="index.html" data-i18n="home">Главная</a>
        <a href="catalog.html" data-i18n="catalog">Каталог</a>
        <a href="cart.html" data-i18n="cart">Корзина</a>
        <a href="favorites.html" data-i18n="favorites">Избранное</a>
        <a href="profile.html" data-i18n="profile">Профиль</a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch">
          <button class="lang-btn" data-lang="uz">UZ</button>
          <button class="lang-btn active" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeToggle">🌙</button>
        <a href="favorites.html" class="icon-btn">❤️ <span class="badge fav-badge">0</span></a>
        <a href="cart.html" class="icon-btn">🛒 <span class="badge cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <main class="main">
    <a href="catalog.html" class="btn btn-sm btn-outline mb-20" data-i18n="back">← Назад</a>
    <div id="productContent"></div>
    <section class="mt-20">
      <h2 class="section-title" data-i18n="related">Похожие товары</h2>
      <div class="products-grid" id="relatedProducts"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-bottom">© 2025 Rut Sport. <span data-i18n="rights">Все права защищены</span></div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    let selectedSize = null;
    let selectedColor = null;
    let qty = 1;
    let currentProduct = null;

    function renderProduct() {
      const id = parseInt(new URLSearchParams(location.search).get('id'));
      const p = PRODUCTS.find(pr => pr.id === id);
      if (!p) {
        document.getElementById('productContent').innerHTML = '<p class="empty-state">Товар не найден</p>';
        return;
      }
      currentProduct = p;
      const lang = getLang();
      if (!selectedSize) selectedSize = p.sizes[0];
      if (!selectedColor) selectedColor = p.colors[0];

      const isFav = isFavorite(p.id);
      const discount = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;

      document.title = p.name[lang] + ' — Rut Sport';

      document.getElementById('productContent').innerHTML = `
        <div class="product-detail">
          <div class="product-gallery">
            <img src="${p.image}" alt="${p.name[lang]}" onerror="this.src='https://via.placeholder.com/600x600?text=Rut+Sport'">
          </div>
          <div class="product-detail-info">
            <h1>${p.name[lang]}</h1>
            <div class="rating">★ ${p.rating} · ${p.stock > 0 ? t('inStock') : t('outOfStock')} (${p.stock})</div>
            <div class="prices">
              <span class="price">${formatPrice(p.price)}</span>
              ${p.oldPrice ? `<span class="old-price">${formatPrice(p.oldPrice)}</span>` : ''}
              ${discount ? `<span class="badge-discount">-${discount}%</span>` : ''}
            </div>
            <div class="size-selector">
              <h4 data-i18n="size">${t('size')}</h4>
              <div class="size-options">
                ${p.sizes.map(s => `<button class="size-btn ${s === selectedSize ? 'active' : ''}" onclick="selectSize('${s}')">${s}</button>`).join('')}
              </div>
            </div>
            <div class="color-selector">
              <h4 data-i18n="color">${t('color')}</h4>
              <div class="color-options">
                ${p.colors.map(c => `<button class="color-btn ${c === selectedColor ? 'active' : ''}" onclick="selectColor('${c}')">${c}</button>`).join('')}
              </div>
            </div>
            <div class="qty-control">
              <button onclick="changeQty(-1)">−</button>
              <span id="qtyVal">${qty}</span>
              <button onclick="changeQty(1)">+</button>
            </div>
            <div class="action-btns">
              <button class="btn btn-primary" onclick="addToCart(${p.id}, selectedSize, qty)">${t('addToCart')}</button>
              <button class="btn btn-outline fav-btn-detail ${isFav ? 'active' : ''}" onclick="toggleFavorite(${p.id}); renderProduct();">
                ${isFav ? '❤️ ' + t('removeFromFav') : '🤍 ' + t('addToFav')}
              </button>
            </div>
            <div class="product-desc">
              <h3 data-i18n="description">${t('description')}</h3>
              <p>${p.description[lang]}</p>
            </div>
          </div>
        </div>
      `;

      // Related
      const related = PRODUCTS.filter(pr => pr.category === p.category && pr.id !== p.id).slice(0, 4);
      document.getElementById('relatedProducts').innerHTML = related.map(productCardHTML).join('');
    }

    function selectSize(s) { selectedSize = s; renderProduct(); }
    function selectColor(c) { selectedColor = c; renderProduct(); }
    function changeQty(d) { qty = Math.max(1, qty + d); document.getElementById('qtyVal').textContent = qty; }

    window.onLangChange = () => { selectedSize = null; selectedColor = null; renderProduct(); };
    document.addEventListener('DOMContentLoaded', renderProduct);
  </script>
</body>
</html>
