<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Rut Sport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Rut <span>Sport</span></a>
      <button class="menu-toggle" id="menuToggle">☰</button>
      <nav class="nav">
        <a href="index.html" data-i18n="home">Главная</a>
        <a href="catalog.html" data-i18n="catalog">Каталог</a>
        <a href="cart.html" data-i18n="cart">Корзина</a>
        <a href="favorites.html" data-i18n="favorites">Избранное</a>
        <a href="profile.html" class="active" data-i18n="profile">Профиль</a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch">
          <button class="lang-btn" data-lang="uz">UZ</button>
          <button class="lang-btn active" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeToggle">🌙</button>
        <a href="favorites.html" class="icon-btn">❤️ <span class="badge fav-badge">0</span></a>
        <a href="cart.html" class="icon-btn">🛒 <span class="badge cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <main class="main">
    <h1 class="section-title" data-i18n="myProfile">Мой профиль</h1>
    <div class="profile-card">
      <div class="form-group">
        <label data-i18n="name">Имя</label>
        <input type="text" id="profName" placeholder="Имя Фамилия">
      </div>
      <div class="form-group">
        <label data-i18n="phone">Телефон</label>
        <input type="tel" id="profPhone" placeholder="+998 90 123 45 67">
      </div>
      <div class="form-group">
        <label data-i18n="email">Email</label>
        <input type="email" id="profEmail" placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label data-i18n="address">Адрес</label>
        <input type="text" id="profAddress" placeholder="Город, улица, дом">
      </div>
      <button class="btn btn-primary" onclick="saveProfileForm()" data-i18n="save">Сохранить</button>
    </div>

    <div class="orders-list">
      <h2 class="section-title" data-i18n="orders">Мои заказы</h2>
      <div id="ordersList"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">© 2025 Rut Sport. <span data-i18n="rights">Все права защищены</span></div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    function loadProfile() {
      const p = getProfile();
      document.getElementById('profName').value = p.name || '';
      document.getElementById('profPhone').value = p.phone || '';
      document.getElementById('profEmail').value = p.email || '';
      document.getElementById('profAddress').value = p.address || '';
    }

    function saveProfileForm() {
      saveProfile({
        name: document.getElementById('profName').value.trim(),
        phone: document.getElementById('profPhone').value.trim(),
        email: document.getElementById('profEmail').value.trim(),
        address: document.getElementById('profAddress').value.trim()
      });
      showToast(t('save') + ' ✓');
    }

    function renderOrders() {
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const lang = getLang();
      const container = document.getElementById('ordersList');
      if (orders.length === 0) {
        container.innerHTML = `<p class="empty-state" data-i18n="noOrders">${t('noOrders')}</p>`;
        return;
      }
      container.innerHTML = orders.map(o => {
        const itemsText = o.items.map(i => {
          const p = PRODUCTS.find(pr => pr.id === i.id);
          return p ? `${p.name[lang]} ×${i.qty}` : '';
        }).filter(Boolean).join(', ');
        return `
          <div class="order-card">
            <div class="order-header">
              <span>#${o.id}</span>
              <span>${new Date(o.date).toLocaleString(lang === 'uz' ? 'uz-UZ' : lang === 'en' ? 'en-US' : 'ru-RU')}</span>
            </div>
            <div class="order-items">${itemsText}</div>
            <div class="price" style="margin-top:8px;">${formatPrice(o.total)}</div>
          </div>
        `;
      }).join('');
    }

    window.onLangChange = () => { applyTranslations(); renderOrders(); };
    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      renderOrders();
    });
  </script>
</body>
</html>
